# PostgreSQL server tuning for the vf database.
#
# Apply by appending these settings to the server's main postgresql.conf, or by placing this file in the
# server's conf.d directory (requires `include_dir = 'conf.d'` in the main
# config). Restart / reload PostgreSQL afterwards.
#
# Notes:
#   * UTF-8: PostgreSQL stores text in the database encoding, which is fixed at
#     CREATE DATABASE time (see postgresql/config/create_database.sql). The
#     pin the default client_encoding here.
#   * READ COMMITTED is the PostgreSQL default, but we set it explicitly so the
#     application's requirement is guaranteed regardless of any site override.

# UTF-8 encoding for client connections.
client_encoding = 'UTF8'

# The application requires READ COMMITTED isolation.
default_transaction_isolation = 'read committed'
